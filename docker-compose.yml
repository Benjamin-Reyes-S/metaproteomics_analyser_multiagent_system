services:

  # Runs the LangGraph pipeline (`python main.py`). Needs outbound internet
  # access to reach the deNBI LLM endpoint (inspect_data, study_planer) and
  # the host's Docker socket to launch analysis-sandbox via `docker run`
  # (run_code.py) -- this container has no Docker daemon of its own
  # (Docker-outside-of-Docker). The repo is bind-mounted at the same
  # absolute path inside and outside the container so the host/workspace
  # paths run_code.py passes to that `docker run` command resolve
  # correctly against the host daemon.
  multiagent-system:
    build:
      context: . # repo root: needs requirements.txt, agents/, graph/, schemas/, main.py
      dockerfile: docker/Dockerfile
    image: metaproteomics-multiagent:latest
    mem_limit: 25g # cap this service at 25GB RAM
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    environment:
      - DENBI_TOKEN
      - DENBI_MODEL
      - DENBI_API_BASE

  # Executes only the LLM-generated analysis script (workspace/code.py).
  # No internet access; dependencies are limited to sandbox/requirements.txt
  # (pandas/numpy/scipy/matplotlib) -- no LangGraph or agent packages.
  # Image tag matches IMAGE_NAME in sandbox/run_code.py.
  analysis-sandbox:
    build:
      context: ./sandbox # ./path : paths relative to docker-compose.yml  
    image: metaproteomics-sandbox:latest 
    network_mode: none
    volumes:
      - ./input:/input:ro #only read permissions 
      - ./workspace:/workspace #place for agent output (code.py, data files, plots, etc.)
